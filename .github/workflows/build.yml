name: Build

on:
  push:
    paths-ignore:
      - README.md
  pull_request:
    paths-ignore:
      - README.md
  workflow_dispatch:

concurrency:
  group: vm-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vm-source-checks:
    name: VM source checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Run VM setup checks
        run: |
          sh vm/os/tests/layout-test.sh
          sh vm/os/tests/steam-firstboot-test.sh
          sh vm/os/tests/steam-runtime-patch-test.sh
          sh vm/os/tests/steamvr-native-test.sh
          sh vm/os/tests/xr-bridge-env-test.sh
          sh vm/os/tests/xr-lifecycle-test.sh
