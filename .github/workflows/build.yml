name: Quest APK

on:
  push:
    branches: [main]
    paths: ['Containerfile', 'Justfile', 'LICENSE.md', 'build_files/**', 'packages/**', 'post_process/quest/**', 'system_files/**', 'tests/**', '.github/workflows/build.yml', '.gitmodules', '.dockerignore', '.gitattributes']
  pull_request:
    paths: ['Containerfile', 'Justfile', 'LICENSE.md', 'build_files/**', 'packages/**', 'post_process/quest/**', 'system_files/**', 'tests/**', '.github/workflows/build.yml', '.gitmodules', '.dockerignore', '.gitattributes']
  workflow_dispatch:
    inputs:
      publish_continuous:
        description: Update the Continuous build release from the default branch
        type: boolean
        default: false

concurrency:
  group: quest-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      - name: Check Quest sources and packaging
        run: bash build_files/quest/check.sh

  quest-rootfs:
    needs: source-checks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Prepare rootfs build tools and disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          sudo apt-get update
          sudo apt-get install -y btrfs-progs zstd pax-utils patchelf
          df -h /
      - uses: docker/setup-buildx-action@v3
      - name: Assemble the clean ARM64 runtime and KDE desktop
        run: sudo --preserve-env=DOCKER_CONFIG bash build_files/quest/build-rootfs.sh "$PWD/rootfs-output"
      - uses: actions/upload-artifact@v4
        with:
          name: quest-build-rootfs
          path: rootfs-output/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  quest-apk:
    needs: quest-rootfs
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Prepare Linux cross-compilers and disk space
        run: |
          sudo rm -rf /opt/ghc /usr/share/dotnet
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu gcc-x86-64-linux-gnu g++-x86-64-linux-gnu \
            cmake ninja-build pkg-config bison flex glslang-tools zlib1g-dev patchelf ffmpeg zstd \
            libdbus-1-dev libdrm-dev libpam0g-dev libglvnd-dev libx11-dev libx11-xcb-dev libxext-dev \
            libxrandr-dev libxxf86vm-dev libxcb-glx0-dev libxcb-shm0-dev libxcb-dri2-0-dev libxcb-dri3-dev \
            libxcb-randr0-dev libxcb-render0-dev libxcb-shape0-dev libxrender-dev \
            libxcb-present-dev libxcb-sync-dev libxcb-xfixes0-dev libxshmfence-dev python3-venv python3-packaging
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.3.13750724' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - uses: actions/cache@v4
        with:
          path: quest-work/downloads
          key: quest-downloads-${{ runner.os }}-${{ hashFiles('build_files/quest/dependencies.json') }}
      - uses: actions/download-artifact@v4
        with:
          name: quest-build-rootfs
          path: rootfs-input
      - name: Extract the verified build rootfs
        run: |
          (cd rootfs-input && sha256sum -c SHA256SUMS)
          mkdir quest-root
          tar --zstd -xf rootfs-input/frame-rootfs.tar.zst -C quest-root
          rm rootfs-input/frame-rootfs.tar.zst
      - name: Build the Linux adapters, GPU drivers and complete payload
        run: |
          python3 -m venv --system-site-packages quest-tools
          quest-tools/bin/pip install -r build_files/quest/requirements.txt
          quest-tools/bin/python build_files/quest/prepare-payload.py \
            --root "$PWD/quest-root" --work "$PWD/quest-work" \
            --android-ndk "$ANDROID_HOME/ndk/27.3.13750724" --output "$PWD/quest-payload"
      - name: Restore the continuous signing identity
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_continuous))
        env:
          QUEST_SIGNING_KEYSTORE_BASE64: ${{ secrets.QUEST_SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$QUEST_SIGNING_KEYSTORE_BASE64" || { echo '::error::Configure QUEST_SIGNING_KEYSTORE_BASE64 before publishing continuous builds.'; exit 1; }
          printf '%s' "$QUEST_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/quest-continuous.keystore"
          chmod 600 "$RUNNER_TEMP/quest-continuous.keystore"
          echo "QUEST_SIGNING_STORE=$RUNNER_TEMP/quest-continuous.keystore" >> "$GITHUB_ENV"
      - name: Build the standalone APK
        run: |
          signing=()
          if [ -n "${QUEST_SIGNING_STORE:-}" ]; then signing+=(-PquestSigningStore="$QUEST_SIGNING_STORE"); fi
          gradle -p packages/quest-runtime --no-daemon --console=plain \
            -PquestPayload="$PWD/quest-payload" -PquestBuildDir="$PWD/quest-apk-build" \
            "${signing[@]}" :app:assembleDebug
      - name: Verify the APK signature and package downloadable files
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose quest-apk-build/outputs/apk/debug/app-debug.apk
          python3 post_process/quest/package-apk.py \
            --apk quest-apk-build/outputs/apk/debug/app-debug.apk --sources quest-payload-sources.zip \
            --output dist --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: stearlight-quest
          path: dist/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quest-build-logs
          path: quest-work/quest-payload-build.log
          retention-days: 7
          if-no-files-found: ignore

  continuous-release:
    name: Continuous build release
    needs: quest-apk
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_continuous))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: quest-continuous-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: stearlight-quest
          path: release-assets
      - name: Update Continuous build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash post_process/quest/publish-continuous.sh release-assets
