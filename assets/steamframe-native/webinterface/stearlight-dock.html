<body style="width:100%;height:100%;margin:0;overflow:hidden;background:#000">
  <div id="root" style="height:100%;width:100%"></div>
  <script>
    /* The shipped dashboard normally receives visibility from vrserver.  The
       preview has no compositor, so expose the same Valve legacy control bar
       only after the bundle has mounted. */
    window.addEventListener("load", function () {
      var reveal = function () {
        if (window.DashboardStore) {
          window.DashboardStore.m_bShowLegacyDashboardBar = true;
          window.DashboardStore.m_eVisibilityState = 1;
          return;
        }
        window.setTimeout(reveal, 50);
      };
      reveal();
    });
  </script>
</body>
