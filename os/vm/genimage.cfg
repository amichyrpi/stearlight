image efi.vfat {
  srcpath = "/work/input/efi"
  vfat {
    label = "STEAR_EFI"
  }
  size = 64M
}

image root.ext4 {
  ext4 {
    label = "stearlight-vm"
    use-mke2fs = true
  }
  size = 4096M
  mountpoint = "/"
}

image stearlight-vm.raw {
  hdimage {
    partition-table-type = "gpt"
  }
  partition esp {
    partition-type-uuid = "U"
    image = "efi.vfat"
    bootable = true
    offset = 1M
  }
  partition root {
    partition-type-uuid = "L"
    image = "root.ext4"
  }
}
