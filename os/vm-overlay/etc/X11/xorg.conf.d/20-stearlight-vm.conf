Section "ServerFlags"
    Option "AutoAddDevices" "true"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection

Section "Device"
    Identifier "Stearlight VMSVGA"
    # The legacy xf86-video-vmware DDX crashes under VirtualBox's VMSVGA
    # emulation.  The generic KMS driver uses the same vmwgfx DRM device
    # without the hypervisor-specific userspace path.
    Driver "modesetting"
    Option "AccelMethod" "glamor"
EndSection

Section "Monitor"
    Identifier "Stearlight Monitor"
    # Reduced-blanking 60 Hz mode used by the QEMU display and by the
    # side-by-side 1440x1600-per-eye scanout.
    Modeline "2880x1600_60.00" 300.25 2880 2928 2960 3040 1600 1603 1609 1646 +HSync -VSync
    Option "PreferredMode" "2880x1600_60.00"
EndSection

Section "Screen"
    Identifier "Stearlight Screen"
    Device "Stearlight VMSVGA"
    Monitor "Stearlight Monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Virtual 2880 1600
        Modes "2880x1600_60.00" "2880x1600" "1920x1080" "1600x900" "1280x720"
    EndSubSection
EndSection
