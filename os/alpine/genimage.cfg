image boot.vfat {
  srcpath = "/work/input/boot"
  vfat {
    label = "STEARBOOT"
  }
  size = 256M
}

image root.ext4 {
  ext4 {
    label = "stearlight"
    use-mke2fs = true
  }
  size = 7424M
  mountpoint = "/"
}

image stearlight-os-rpi4.img {
  hdimage {
    partition-table-type = "mbr"
  }
  partition boot {
    partition-type = 0x0c
    bootable = true
    image = "boot.vfat"
    offset = 1M
  }
  partition root {
    partition-type = 0x83
    image = "root.ext4"
  }
}
