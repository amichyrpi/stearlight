image efi.vfat {
  srcpath = "/work/input/efi"
  vfat {
    label = "STEAR_EFI"
  }
  size = 64M
}

image root.ext4 {
  ext4 {
    label = "stearlight-vm"
    use-mke2fs = true
    # genimage otherwise disables both lazy initialization passes, causing
    # every VM build to write all 12 GiB of the sparse root image.  The VM
    # kernel completes the inode-table initialization on first mount and the
    # VDI stays compact for the QEMU test loop.
    extraargs = "-E lazy_itable_init=1,lazy_journal_init=1"
  }
  # Steam's first-run client and Steam Linux Runtime are unpacked alongside
  # the base appliance.  Keep enough headroom for the compressed downloads
  # and their temporary extraction trees in the VM while keeping the generated
  # image within the dedicated build drive's available space.
  size = 8192M
  mountpoint = "/"
}

image stearlight-vm.raw {
  hdimage {
    partition-table-type = "gpt"
  }
  partition esp {
    partition-type-uuid = "U"
    image = "efi.vfat"
    bootable = true
    offset = 1M
  }
  partition root {
    partition-type-uuid = "L"
    image = "root.ext4"
  }
}
