image efi.vfat {
  srcpath = "/work/input/efi"
  vfat {
    label = "STEAR_EFI"
  }
  size = 64M
}

image root.ext4 {
  ext4 {
    label = "stearlight-vm"
    use-mke2fs = true
    # Keep inode-table initialization lazy so image creation stays compact.
    # Do not defer journal initialization: Alpine's early initramfs mounts
    # this filesystem before userspace starts, and an uninitialized journal
    # is rejected as "Invalid argument" by the ext4 mount path.
    extraargs = "-E lazy_itable_init=1"
  }
  # Steam's first-run client and Steam Linux Runtime are unpacked alongside
  # the base appliance.  Keep enough headroom for the compressed downloads
  # and their temporary extraction trees in the VM while keeping the generated
  # image within the dedicated build drive's available space.
  # Valve's Steam runtime is unpacked on first boot beside the SteamVR
  # payload. Keep enough headroom for that extraction and the full native
  # SteamVR tools/content tree; 8 GiB left vrstartup with ENOSPC before Steam
  # could finish creating its runtime and path registry.
  size = 12288M
  mountpoint = "/"
}

image stearlight-vm.raw {
  hdimage {
    partition-table-type = "gpt"
  }
  partition esp {
    partition-type-uuid = "U"
    image = "efi.vfat"
    bootable = true
    offset = 1M
  }
  partition root {
    partition-type-uuid = "L"
    image = "root.ext4"
  }
}
