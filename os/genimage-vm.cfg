image efi.vfat {
  srcpath = "/work/input/efi"
  vfat {
    label = "STEAR_EFI"
  }
  size = 64M
}

image root.ext4 {
  ext4 {
    label = "stearlight-vm"
    use-mke2fs = true
  }
  # Steam's first-run client and Steam Linux Runtime are unpacked alongside
  # the base appliance.  Keep enough headroom for the compressed downloads
  # and their temporary extraction trees in the VM; the baked client already
  # occupies several GiB before the first update is applied.
  size = 12288M
  mountpoint = "/"
}

image stearlight-vm.raw {
  hdimage {
    partition-table-type = "gpt"
  }
  partition esp {
    partition-type-uuid = "U"
    image = "efi.vfat"
    bootable = true
    offset = 1M
  }
  partition root {
    partition-type-uuid = "L"
    image = "root.ext4"
  }
}
