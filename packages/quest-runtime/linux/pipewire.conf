# Native PCVR audio connects through PipeWire to the existing Quest PCM bridge.
context.properties = {
    core.daemon = true
    core.name = pipewire-0
    default.clock.rate = 48000
    default.clock.quantum = 480
    default.clock.min-quantum = 240
    default.clock.max-quantum = 960
    mem.warn-mlock = false
}
context.spa-libs = {
    support.* = support/libspa-support
    audio.convert.* = audioconvert/libspa-audioconvert
}
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-access
      args = { access.socket = {
          pipewire-0 = unrestricted
          pipewire-0-manager = unrestricted
      } }
    }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
    { name = libpipewire-module-session-manager }
    { name = libpipewire-module-pulse-tunnel
      args = {
        tunnel.mode = sink
        pulse.server.address = "unix:/tmp/stearlight-runtime/pulse/native"
        pulse.latency = 30
        target.object = quest_output
        audio.rate = 48000
        audio.channels = 2
        audio.position = [ FL FR ]
        stream.props = {
            node.name = quest_output
            node.description = "Quest Speakers"
            media.class = Audio/Sink
            priority.session = 1000
        }
      }
    }
    { name = libpipewire-module-pulse-tunnel
      args = {
        tunnel.mode = source
        pulse.server.address = "unix:/tmp/stearlight-runtime/pulse/native"
        pulse.latency = 30
        target.object = quest_microphone
        audio.rate = 48000
        audio.channels = 1
        audio.position = [ MONO ]
        stream.props = {
            node.name = quest_microphone
            node.description = "Quest Microphone"
            media.class = Audio/Source
            priority.session = 1000
        }
      }
    }
]
context.objects = [
    { factory = spa-node-factory
      args = { factory.name = support.node.driver node.name = Dummy-Driver
               node.group = pipewire.dummy priority.driver = 20000 }
    }
]
