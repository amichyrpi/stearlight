# Android owns the physical devices; only the two Pulse tunnel nodes are used.
wireplumber.profiles = {
    main = {
        monitor.alsa = disabled
        monitor.bluez = disabled
        monitor.bluez-midi = disabled
        monitor.v4l2 = disabled
        monitor.libcamera = disabled
    }
}

# PRoot cannot inspect Android's /proc/<pid>/root. PipeWire therefore marks
# private app clients as Flatpak clients. Retain the access granted by our
# app-owned socket so the session manager can configure and link audio ports.
access.rules = [
    {
        matches = [ { pipewire.access = unrestricted } ]
        actions = { update-props = {
            access = unrestricted
            default_permissions = all
        } }
    }
]
