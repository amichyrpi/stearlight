plugins { id 'com.android.application' }
def payload = providers.gradleProperty('questPayload').orElse('../../../.cache/quest').get()
layout.buildDirectory = file(providers.gradleProperty('questBuildDir').orElse('build').get())
android {
 namespace 'net.stearlight.quest'
 compileSdk 35
 ndkVersion '27.3.13750724'
 defaultConfig {
  applicationId 'net.stearlight.quest'
  minSdk 29
  targetSdk 32
  versionCode 2
  versionName '0.2.0'
  ndk { abiFilters 'arm64-v8a' }
  externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static', "-DQUEST_PAYLOAD=${file(payload).absolutePath.replace('\\','/')}"; cppFlags '-std=c++17' } }
 }
 sourceSets { main { assets.srcDirs = [file("${payload}/assets")]; jniLibs.srcDirs = [file("${payload}/jniLibs")] } }
 externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
 buildFeatures { prefab true }
 if (providers.gradleProperty('questSigningStore').isPresent()) {
  // CI restores this private development certificate from a repository secret.
  signingConfigs {
   continuous {
    storeFile file(providers.gradleProperty('questSigningStore').get())
    storePassword 'android'
    keyAlias 'androiddebugkey'
    keyPassword 'android'
   }
  }
  buildTypes { debug { signingConfig signingConfigs.continuous } }
 }
 packaging { jniLibs { useLegacyPackaging = true; keepDebugSymbols += ['**/libproot*.so'] } }
 androidResources { noCompress += ['gz','glb','bin'] }
}
dependencies { implementation 'org.khronos.openxr:openxr_loader_for_android:1.0.34' }
